name: Release on version bump

on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml

permissions:
  contents: write

concurrency:
  group: release-on-version-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Confirm version bump
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$BEFORE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "Cannot verify a version bump: push event has no usable before SHA." >&2
            exit 1
          fi

          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BEFORE_SHA" || true
          fi
          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "Cannot verify a version bump: before commit $BEFORE_SHA is unavailable." >&2
            exit 1
          fi

          git show "${BEFORE_SHA}:pyproject.toml" > "$RUNNER_TEMP/pyproject-before.toml" || {
            echo "Cannot verify a version bump: pyproject.toml did not exist at $BEFORE_SHA." >&2
            exit 1
          }

          current_version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"
          previous_version="$(python - "$RUNNER_TEMP/pyproject-before.toml" <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"

          semver_re='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
          if [[ ! "$current_version" =~ $semver_re ]]; then
            echo "Version '$current_version' is not a valid SemVer-style version." >&2
            exit 1
          fi
          if [[ "$current_version" == "$previous_version" ]]; then
            echo "[project].version did not change from $BEFORE_SHA." >&2
            exit 1
          fi

          tag="v$current_version"
          echo "version=$current_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Refuse an existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          set +e
          tag_result="$(git ls-remote --exit-code --tags origin "refs/tags/$TAG" 2>&1)"
          tag_status=$?
          set -e
          case "$tag_status" in
            0)
              echo "Tag $TAG already exists." >&2
              exit 1
              ;;
            2)
              ;;
            *)
              echo "Could not safely establish that tag $TAG is absent: $tag_result" >&2
              exit 1
              ;;
          esac
          if api_result="$(gh api --silent "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" 2>&1)"; then
            echo "Release $TAG already exists." >&2
            exit 1
          elif [[ "$api_result" != *"(HTTP 404)"* ]]; then
            echo "Could not safely establish that release $TAG is absent: $api_result" >&2
            exit 1
          fi

      - name: Sync locked dependencies
        run: uv sync --frozen --dev

      - name: Run non-live tests
        run: uv run pytest -m "not live"

      - name: Build wheel and source distribution
        run: uv build --no-sources

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/*.whl dist/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
